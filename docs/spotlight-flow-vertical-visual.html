<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotlight Investigation Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #07070a;
      --ink-2: #0c0c10;
      --paper: #ede8dc;
      --paper-2: #e3ddce;
      --paper-muted: rgba(237, 232, 220, 0.62);
      --paper-faint: rgba(237, 232, 220, 0.18);
      --warm: #c16a34;
      --cool: #346fa8;
      --green: #4a7d3f;
      --amber: #8a6212;
      --red: #a83838;
      --dark-text: #17140e;
      --dark-muted: rgba(23, 20, 14, 0.62);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .diagram {
      width: 100%;
      height: auto;
      display: block;
      background: var(--ink-2);
      border: 1px solid var(--paper-faint);
    }

    svg text {
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .serif {
      font-family: "Fraunces", serif;
      font-weight: 500;
    }

    .eyebrow {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .node-title {
      font-size: 19px;
      font-weight: 600;
    }

    .node-sub {
      font-size: 18px;
    }

    .small {
      font-size: 15px;
    }

    .svc {
      font-size: 14px;
    }

    .callout {
      font-size: 14px;
      font-weight: 600;
    }

    /* Outside services: the only dashed lines in the diagram. */
    .outside {
      fill: none;
      stroke: rgba(237, 232, 220, 0.78);
      stroke-width: 2;
      stroke-dasharray: 6 5;
    }
  </style>
</head>
<body>
  <svg class="diagram" viewBox="0 0 600 2270" role="img" aria-labelledby="ttl">
    <title id="ttl">Spotlight vertical flow: named phases, the opt-in Research phase with its triage, the outside services Spotlight calls (dashed), child skills and RLM details at the bottom.</title>

    <defs>
      <marker id="arrow-paper" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
        <path d="M1,1 L11,6.5 L1,12 Z" fill="#ede8dc"></path>
      </marker>
      <marker id="arrow-cool" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
        <path d="M1,1 L11,6.5 L1,12 Z" fill="#346fa8"></path>
      </marker>
      <marker id="arrow-amber" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
        <path d="M1,1 L11,6.5 L1,12 Z" fill="#8a6212"></path>
      </marker>
    </defs>

    <rect x="0" y="0" width="600" height="2270" fill="#0c0c10"></rect>

    <!-- Spine -->
    <g stroke="#ede8dc" stroke-width="3" fill="none">
      <path d="M227 70 L227 94" marker-end="url(#arrow-paper)"></path>
      <path d="M227 212 L227 236" marker-end="url(#arrow-paper)"></path>
      <path d="M227 318 L227 342" marker-end="url(#arrow-paper)"></path>
      <path d="M227 424 L227 448" marker-end="url(#arrow-paper)"></path>
      <path d="M227 510 L227 534" marker-end="url(#arrow-paper)"></path>
      <path d="M227 634 L227 658" marker-end="url(#arrow-paper)"></path>
      <path d="M227 740 L227 770" marker-end="url(#arrow-paper)"></path>
      <path d="M227 1140 L227 1168" marker-end="url(#arrow-paper)"></path>
      <path d="M227 1540 L227 1564" marker-end="url(#arrow-paper)"></path>
      <path d="M227 1646 L227 1670" marker-end="url(#arrow-paper)"></path>
      <path d="M227 1752 L227 1776" marker-end="url(#arrow-paper)"></path>
      <path d="M227 1878 L227 1902" marker-end="url(#arrow-paper)"></path>
    </g>

    <!-- Lead -->
    <rect x="97" y="24" width="260" height="46" rx="23" fill="#ede8dc" stroke="rgba(237,232,220,0.28)" stroke-width="2"></rect>
    <text x="227" y="52" text-anchor="middle" fill="#17140e" class="small" font-weight="600" letter-spacing="0.08em">LEAD · URL · DOCUMENT</text>

    <!-- Orchestrator -->
    <rect x="52" y="96" width="350" height="116" rx="8" fill="#07070a" stroke="#c16a34" stroke-width="3"></rect>
    <text x="227" y="124" text-anchor="middle" fill="#c16a34" class="eyebrow">ORCHESTRATOR</text>
    <text x="227" y="160" text-anchor="middle" fill="#fff5d9" class="serif" font-size="30">Spotlight</text>
    <text x="227" y="184" text-anchor="middle" fill="rgba(237,232,220,0.72)" class="node-sub">manages gates · spawns agents</text>
    <text x="227" y="204" text-anchor="middle" fill="rgba(237,232,220,0.72)" class="node-sub">validates artifacts</text>

    <!-- Preflight -->
    <rect x="52" y="238" width="350" height="80" rx="8" fill="#e3ddce" stroke="rgba(237,232,220,0.30)" stroke-width="2.5"></rect>
    <text x="227" y="266" text-anchor="middle" fill="#c16a34" class="eyebrow">PREFLIGHT</text>
    <text x="227" y="300" text-anchor="middle" fill="#17140e" class="node-title" style="font-size:17px">Check tools and load skills (1)</text>

    <!-- Brief -->
    <rect x="52" y="344" width="350" height="80" rx="8" fill="#e3ddce" stroke="rgba(237,232,220,0.30)" stroke-width="2.5"></rect>
    <text x="227" y="372" text-anchor="middle" fill="#c16a34" class="eyebrow">BRIEF</text>
    <text x="227" y="406" text-anchor="middle" fill="#17140e" class="node-title">Scope the lead with the user</text>

    <!-- Brief gate -->
    <rect x="72" y="450" width="310" height="60" rx="8" fill="rgba(193,106,52,0.14)" stroke="#c16a34" stroke-width="2.5"></rect>
    <circle cx="98" cy="480" r="10" fill="none" stroke="#4a7d3f" stroke-width="2.5"></circle>
    <path d="M92 480 l4 4 l9 -10" fill="none" stroke="#4a7d3f" stroke-width="2.5"></path>
    <text x="120" y="474" fill="#c16a34" class="eyebrow">BRIEF GATE</text>
    <text x="120" y="497" fill="#ede8dc" class="node-sub">approve brief direction</text>

    <!-- Planning agent -->
    <rect x="52" y="536" width="350" height="98" rx="8" fill="#07070a" stroke="rgba(237,232,220,0.72)" stroke-width="2.5"></rect>
    <text x="227" y="564" text-anchor="middle" fill="#c16a34" class="eyebrow">SUB-AGENT · PLANNING</text>
    <text x="227" y="600" text-anchor="middle" fill="#fff5d9" class="serif" font-size="28">Investigator</text>
    <text x="227" y="624" text-anchor="middle" fill="rgba(237,232,220,0.72)" class="node-sub">writes methodology.json</text>

    <!-- Outside service: OSINT Navigator while planning -->
    <path class="outside" d="M402 585 L440 585"></path>
    <rect class="outside" x="440" y="540" width="148" height="90" rx="8"></rect>
    <text x="452" y="564" fill="#ede8dc" class="svc" font-weight="600" letter-spacing="0.02em">OSINT</text>
    <text x="452" y="582" fill="#ede8dc" class="svc" font-weight="600" letter-spacing="0.02em">NAVIGATOR</text>
    <text x="452" y="602" fill="rgba(237,232,220,0.72)" class="svc">tool lookups</text>
    <text x="452" y="620" fill="rgba(237,232,220,0.72)" class="svc">for the plan</text>

    <!-- Methodology gate -->
    <rect x="72" y="660" width="310" height="80" rx="8" fill="rgba(193,106,52,0.14)" stroke="#c16a34" stroke-width="2.5"></rect>
    <circle cx="98" cy="700" r="10" fill="none" stroke="#4a7d3f" stroke-width="2.5"></circle>
    <path d="M92 700 l4 4 l9 -10" fill="none" stroke="#4a7d3f" stroke-width="2.5"></path>
    <text x="120" y="686" fill="#c16a34" class="eyebrow">METHODOLOGY GATE</text>
    <text x="120" y="709" fill="#ede8dc" class="node-sub">approve plan, research</text>
    <text x="120" y="729" fill="#ede8dc" class="node-sub">topics · RLM (2)</text>

    <!-- Research: one opt-in switch turns on lanes and triage -->
    <rect x="34" y="772" width="386" height="368" rx="12" fill="rgba(52,111,168,0.05)" stroke="#346fa8" stroke-width="2.5"></rect>
    <text x="50" y="800" fill="#86b9e8" class="eyebrow">RESEARCH · ONLY WHEN SWITCHED ON</text>

    <rect x="52" y="816" width="350" height="80" rx="8" fill="#07070a" stroke="rgba(237,232,220,0.72)" stroke-width="2.5"></rect>
    <text x="227" y="842" text-anchor="middle" fill="#c16a34" class="eyebrow">CODE · ONE LANE PER TOPIC</text>
    <text x="227" y="878" text-anchor="middle" fill="#fff5d9" class="serif" font-size="22">Research lanes bring back leads</text>
    <path d="M227 896 L227 920" stroke="#ede8dc" stroke-width="3" fill="none" marker-end="url(#arrow-paper)"></path>

    <rect x="72" y="922" width="310" height="90" rx="8" fill="#e3ddce" stroke="#346fa8" stroke-width="2.5"></rect>
    <text x="227" y="948" text-anchor="middle" fill="#346fa8" class="eyebrow">CHECKS · MERGE · CLUES</text>
    <text x="227" y="974" text-anchor="middle" fill="#17140e" class="node-sub" font-weight="600">quotes checked · clue rules</text>
    <text x="227" y="998" text-anchor="middle" fill="#17140e" class="node-sub" font-weight="600">decision model triages</text>
    <path d="M227 1012 L227 1036" stroke="#ede8dc" stroke-width="3" fill="none" marker-end="url(#arrow-paper)"></path>

    <rect x="72" y="1038" width="310" height="80" rx="8" fill="rgba(193,106,52,0.14)" stroke="#c16a34" stroke-width="2.5"></rect>
    <circle cx="98" cy="1078" r="10" fill="none" stroke="#4a7d3f" stroke-width="2.5"></circle>
    <path d="M92 1078 l4 4 l9 -10" fill="none" stroke="#4a7d3f" stroke-width="2.5"></path>
    <text x="120" y="1064" fill="#c16a34" class="eyebrow">RESEARCH GATE</text>
    <text x="120" y="1087" fill="#ede8dc" class="node-sub">mark clues and</text>
    <text x="120" y="1107" fill="#ede8dc" class="node-sub">directions · one stop</text>

    <!-- Outside service: Digital Signals Matrix scores clues -->
    <path class="outside" d="M382 1078 L440 1078"></path>
    <rect class="outside" x="440" y="1022" width="148" height="112" rx="8"></rect>
    <text x="452" y="1046" fill="#ede8dc" class="svc" font-weight="600" letter-spacing="0.02em">DIGITAL</text>
    <text x="452" y="1064" fill="#ede8dc" class="svc" font-weight="600" letter-spacing="0.02em">SIGNALS MATRIX</text>
    <text x="452" y="1084" fill="rgba(237,232,220,0.72)" class="svc">scores clues</text>
    <text x="452" y="1106" fill="#86b9e8" class="svc">Lab members ·</text>
    <text x="452" y="1124" fill="#86b9e8" class="svc">coming</text>

    <!-- Stall: one targeted research round -->
    <path d="M72 1469 L10 1469 L10 856 L48 856" fill="none" stroke="#346fa8" stroke-width="3" marker-end="url(#arrow-cool)"></path>
    <text x="26" y="1160" fill="#86b9e8" class="callout" text-anchor="middle" transform="rotate(-90 26 1160)">STALL · ONE RESEARCH ROUND</text>

    <!-- Investigation loop -->
    <rect x="34" y="1170" width="386" height="370" rx="12" fill="rgba(193,106,52,0.05)" stroke="#8a6212" stroke-width="2.5"></rect>
    <text x="50" y="1198" fill="#d9a65f" class="eyebrow">INVESTIGATION · CYCLES 1–3</text>

    <rect x="52" y="1214" width="350" height="86" rx="8" fill="#07070a" stroke="rgba(237,232,220,0.72)" stroke-width="2.5"></rect>
    <text x="227" y="1240" text-anchor="middle" fill="#c16a34" class="eyebrow">SUB-AGENT · EXECUTION</text>
    <text x="227" y="1278" text-anchor="middle" fill="#fff5d9" class="serif" font-size="22">Investigator collects evidence</text>
    <path d="M227 1300 L227 1324" stroke="#ede8dc" stroke-width="3" fill="none" marker-end="url(#arrow-paper)"></path>

    <!-- Outside service: OSINT Navigator during the cycles -->
    <path class="outside" d="M402 1236 L440 1236"></path>
    <rect class="outside" x="440" y="1194" width="148" height="90" rx="8"></rect>
    <text x="452" y="1218" fill="#ede8dc" class="svc" font-weight="600" letter-spacing="0.02em">OSINT</text>
    <text x="452" y="1236" fill="#ede8dc" class="svc" font-weight="600" letter-spacing="0.02em">NAVIGATOR</text>
    <text x="452" y="1256" fill="rgba(237,232,220,0.72)" class="svc">investigator</text>
    <text x="452" y="1274" fill="rgba(237,232,220,0.72)" class="svc">finds tools</text>

    <rect x="52" y="1326" width="350" height="86" rx="8" fill="#07070a" stroke="rgba(237,232,220,0.72)" stroke-width="2.5"></rect>
    <text x="227" y="1352" text-anchor="middle" fill="#c16a34" class="eyebrow">SUB-AGENT · VERIFICATION</text>
    <text x="227" y="1390" text-anchor="middle" fill="#fff5d9" class="serif" font-size="22">Fact-checker verifies claims</text>
    <path d="M227 1412 L227 1436" stroke="#ede8dc" stroke-width="3" fill="none" marker-end="url(#arrow-paper)"></path>

    <rect x="72" y="1438" width="310" height="62" rx="8" fill="#e3ddce" stroke="#8a6212" stroke-width="2.5"></rect>
    <text x="227" y="1462" text-anchor="middle" fill="#8a6212" class="eyebrow">READINESS CHECK</text>
    <text x="227" y="1488" text-anchor="middle" fill="#17140e" class="node-sub" font-weight="600">ready, or loop on gaps</text>

    <path d="M382 1469 L411 1469 L411 1290 L406 1290" fill="none" stroke="#8a6212" stroke-width="3" marker-end="url(#arrow-amber)"></path>
    <text x="432" y="1384" fill="#d9a65f" class="callout" text-anchor="middle" transform="rotate(90 432 1384)">NEXT CYCLE</text>

    <!-- Investigation gate (end of Investigation) -->
    <rect x="72" y="1566" width="310" height="80" rx="8" fill="rgba(193,106,52,0.14)" stroke="#c16a34" stroke-width="2.5"></rect>
    <circle cx="98" cy="1606" r="10" fill="none" stroke="#4a7d3f" stroke-width="2.5"></circle>
    <path d="M92 1606 l4 4 l9 -10" fill="none" stroke="#4a7d3f" stroke-width="2.5"></path>
    <text x="120" y="1592" fill="#c16a34" class="eyebrow">INVESTIGATION GATE</text>
    <text x="120" y="1615" fill="#ede8dc" class="node-sub">approve findings</text>
    <text x="120" y="1635" fill="#ede8dc" class="node-sub">review.html</text>

    <!-- Report -->
    <rect x="52" y="1672" width="350" height="80" rx="8" fill="#e3ddce" stroke="rgba(237,232,220,0.30)" stroke-width="2.5"></rect>
    <text x="227" y="1700" text-anchor="middle" fill="#c16a34" class="eyebrow">REPORT · ENDS AT REPORT GATE</text>
    <text x="227" y="1734" text-anchor="middle" fill="#17140e" class="node-title">Draft report package</text>

    <!-- Outside service: Digital Signals Matrix scores findings, the report shows them -->
    <path class="outside" d="M382 1606 L440 1606"></path>
    <path class="outside" d="M402 1712 L440 1712"></path>
    <rect class="outside" x="440" y="1570" width="148" height="176" rx="8"></rect>
    <text x="452" y="1594" fill="#ede8dc" class="svc" font-weight="600" letter-spacing="0.02em">DIGITAL</text>
    <text x="452" y="1612" fill="#ede8dc" class="svc" font-weight="600" letter-spacing="0.02em">SIGNALS MATRIX</text>
    <text x="452" y="1632" fill="rgba(237,232,220,0.72)" class="svc">scores findings</text>
    <text x="452" y="1700" fill="rgba(237,232,220,0.72)" class="svc">report shows</text>
    <text x="452" y="1718" fill="rgba(237,232,220,0.72)" class="svc">the scores</text>
    <text x="452" y="1658" fill="#86b9e8" class="svc">Lab members ·</text>
    <text x="452" y="1676" fill="#86b9e8" class="svc">coming</text>

    <!-- Ingest -->
    <rect x="52" y="1778" width="350" height="100" rx="8" fill="#e3ddce" stroke="rgba(237,232,220,0.30)" stroke-width="2.5"></rect>
    <text x="227" y="1806" text-anchor="middle" fill="#c16a34" class="eyebrow">INGEST · ENDS AT INGEST GATE</text>
    <text x="227" y="1840" text-anchor="middle" fill="#17140e" class="node-title">Write approved knowledge</text>
    <text x="227" y="1864" text-anchor="middle" fill="#17140e" class="node-title">to your wiki</text>

    <!-- Wiki -->
    <rect x="97" y="1904" width="260" height="46" rx="23" fill="#ede8dc" stroke="rgba(237,232,220,0.28)" stroke-width="2"></rect>
    <text x="227" y="1932" text-anchor="middle" fill="#17140e" class="small" font-weight="600" letter-spacing="0.08em">YOUR WIKI · spotlight/</text>

    <!-- Detail boxes -->
    <rect x="20" y="1984" width="560" height="96" rx="8" fill="rgba(237,232,220,0.05)" stroke="rgba(237,232,220,0.22)" stroke-width="2"></rect>
    <circle cx="52" cy="2016" r="16" fill="#e3ddce"></circle>
    <text x="52" y="2022" text-anchor="middle" fill="#17140e" font-size="15" font-weight="600">1</text>
    <text x="82" y="2012" fill="#c16a34" class="eyebrow">CHILD SKILLS</text>
    <text x="82" y="2038" fill="#ede8dc" class="node-sub">OSINT, grounding, shell safety, archiving,</text>
    <text x="82" y="2062" fill="#ede8dc" class="node-sub">review, report drafting, monitoring, ingest.</text>

    <rect x="20" y="2096" width="560" height="96" rx="8" fill="rgba(52,111,168,0.08)" stroke="#346fa8" stroke-width="2"></rect>
    <circle cx="52" cy="2128" r="16" fill="#e3ddce"></circle>
    <text x="52" y="2134" text-anchor="middle" fill="#17140e" font-size="15" font-weight="600">2</text>
    <text x="82" y="2124" fill="#86b9e8" class="eyebrow">OPTIONAL LOCAL LEAD EXTRACTION</text>
    <text x="82" y="2150" fill="#ede8dc" class="node-sub">RLM runs only after methodology approval.</text>
    <text x="82" y="2174" fill="#ede8dc" class="node-sub">rlm-analysis.json is leads only.</text>

    <!-- Legend -->
    <path class="outside" d="M20 2232 L64 2232"></path>
    <text x="76" y="2237" fill="rgba(237,232,220,0.72)" class="svc">dashed: outside service</text>
  </svg>
</body>
</html>
