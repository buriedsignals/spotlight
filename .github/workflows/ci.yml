name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    name: Windows integrations
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Firecrawl CLI robustness (tree kill, no stdin, UTF-8 output)
        run: python tests/firecrawl-cli-check.py

  smoke:
    name: Smoke + Eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Flue test dependencies
        run: npm ci --prefix harness/flue

      - name: Install Python test deps
        run: pip install --quiet jsonschema==4.25.1 requests==2.32.5

      - name: Install c2patool 0.27.22 (tests/provenance-manifest-check.py)
        run: |
          curl -fsSL -o /tmp/c2patool.tar.gz https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v0.27.22/c2patool-v0.27.22-x86_64-unknown-linux-gnu.tar.gz
          echo "6f138ad53da1a62f1cd6ee71c60727efa27d13b811f4c0ea8c2a8528968b358b  /tmp/c2patool.tar.gz" | sha256sum -c -
          mkdir -p /tmp/c2patool && tar -xzf /tmp/c2patool.tar.gz -C /tmp/c2patool
          install -m 0755 "$(find /tmp/c2patool -type f -name c2patool | head -1)" /usr/local/bin/c2patool
          c2patool --version

      - name: Install PDF text extraction (tests/test_pdfparse.py)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Run smoke test
        run: bash tests/smoke.sh
        env:
          SPOTLIGHT_REQUIRE_JSONSCHEMA: '1'

      - name: Run eval (contract compliance + sample data)
        run: bash tests/eval.sh

      - name: HTML pages parse (landing pages)
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser

          VOID = {"area", "base", "br", "col", "embed", "hr", "img", "input",
                  "link", "meta", "param", "source", "track", "wbr"}

          class BalanceParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.problems = []

              def handle_starttag(self, tag, attrs):
                  if tag not in VOID:
                      self.stack.append(tag)

              def handle_endtag(self, tag):
                  if tag in VOID:
                      return
                  if tag in self.stack:
                      del self.stack[len(self.stack) - 1 - self.stack[::-1].index(tag):]
                  else:
                      self.problems.append(f"unmatched </{tag}> at line {self.getpos()[0]}")

          failed = False
          for page in ["index.html", "docs/index.html", "going-sovereign/index.html"]:
              parser = BalanceParser()
              with open(page, encoding="utf-8") as fh:
                  parser.feed(fh.read())
              parser.close()
              if parser.problems or parser.stack:
                  failed = True
                  print(f"FAIL {page}: problems={parser.problems} left-open={parser.stack}")
              else:
                  print(f"{page} parses with balanced tags")
          raise SystemExit(1 if failed else 0)
          PY
